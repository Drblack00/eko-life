# Render Blueprint — Èkó Life
# Web service (Node server + serves built client). The database is an external
# Supabase Postgres (free tier): Render allows only one free managed Postgres
# per workspace and that slot is taken by benin-life-db, so DATABASE_URL is set
# manually in the Render dashboard (sync:false keeps the Blueprint from
# overwriting it).

services:
  - type: web
    name: eko-life
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build:web
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /api/health
